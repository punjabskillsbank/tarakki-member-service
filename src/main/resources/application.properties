# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/tarakki_local
spring.datasource.username=tarakki
spring.datasource.password=tarakki

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:tarakki-local-dev-secret-key-must-be-at-least-32-bytes-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}